# Prelims-style tags (regex, case-insensitive unless (?-i) used).
tags:
  Scheme: '\b(yojanas?|abhiyan|schemes?|missions?|pradhan mantri|pm-[a-z]+)\b'
  Report/Index: '\b(index|indices|reports?|rankings?|surveys?|atlas|outlook|census|NFHS|PLFS|ASER|NIRF)\b'
  Judgment: '\b(verdict|judgment|judgement|constitution bench|quash(es|ed)?|upholds?|strikes? down|high court|supreme court)\b'
  Act/Bill/Rules: '(?-i:\b(Act|Bill|Rules|Ordinance|Code|Regulations)\b)|\b(notified|notification|amendment|gazette)\b'
  Appointment: '\b(appointed|appoints|appointment|takes charge|sworn in|assumes (office|charge)|elected (as|president)|new chief|named (as )?(chief|head|chair))\b'
  Agreement/MoU: '\b(mous?|memorand(um|a)|agreements?|treaty|treaties|pacts?|accords?|joint statement|signed)\b'
  Species: '\b(species|iucn|endangered|tiger|leopard|elephant|cheetah|vulture|bustard|frog|orchid|dolphin|turtle|whale|butterfly|spider|snake|lizard)\b'
  Place in news: '\b(national park|wildlife sanctuary|tiger reserve|ramsar|wetland|biosphere|strait|island|lake|glacier|volcano|pass|plateau|gulf of|sea of)\b'
  Award: '\b(awards?|prizes?|honoured|honored|padma|nobel|booker|bharat ratna|laureates?|medals?)\b'
  Day/Observance: '\b((world|international|national) [a-z ]{2,30} day|diwas|jayanti|anniversary)\b'
  Exercise: '\b((joint|military|naval|air|bilateral|trilateral) exercise)\b|(?-i:\b(Exercise|Ex) [A-Z][A-Za-z]+)'
  Data/Stats: '\b(gdp|inflation|cpi|wpi|iip|forex reserves?|per cent|percent|crore|lakh tonnes)\b'

# Five areas that are easy to miss. Each is `all:` (every group must hit) or `any:`.
watch_areas:
  marine:
    label: Marine & coastal (EEZ, UNCLOS, Blue Economy, deep sea)
    any: [EEZ, UNCLOS, blue economy, deep sea, deep-sea, deep ocean mission, maritime, coastal, fisheries, fishermen, marine, coral, seabed, high seas, BBNJ, Indian Ocean, sea level, ocean]
  dpi:
    label: Digital Public Infrastructure & data governance
    any: [digital public infrastructure, DPI, UPI, Aadhaar, DigiLocker, ONDC, DPDP, data protection, data governance, account aggregator, India Stack, digital rupee, e-RUPI, CoWIN, ABDM, UIDAI, NPCI]
  neighbourhood:
    label: Political change in the neighbourhood
    all:
      - [Bangladesh, Nepal, Sri Lanka, Myanmar, Maldives, Pakistan, Afghanistan, Bhutan]
      - [president, prime minister, election, elections, government, coup, parliament, sworn, protest, junta, taliban, cabinet, resigns, interim, poll]
  appointments:
    label: Appointments to constitutional / statutory / regulatory bodies
    all:
      - [appointed, appoints, appointment, takes charge, sworn in, assumes office, named, elevated, reappointed, extension]
      - [RBI, Election Commission, CAG, UPSC, NHRC, SEBI, TRAI, Finance Commission, Chief Justice, judge, judges, Governor, Lokpal, CVC, CIC, NITI, chairman, chairperson, Chief Election Commissioner, Attorney General, Solicitor General, commission, authority, board, secretary]
  defence_tech:
    label: Defence-technology cooperation agreements
    all:
      - [defence, defense, military, DRDO, armed forces, navy, army, air force, jet engine, submarine]
      - [agreement, MoU, co-development, co-production, technology transfer, iCET, TRUST, INDUS-X, joint development, deal, partnership, pact, roadmap]

# Google News watchlist: each query becomes its own source (tier "watch").
# `when:1d` keeps it to the last day. Keep it UPSC-shaped: structures, not events.
watchlist:
  interval: 60   # minutes
  limit: 30
  queries:
    - '"cabinet approves" India when:1d'
    - '"Supreme Court" judgment India when:1d'
    - '"constitution bench" when:2d'
    - 'Bill passed Parliament India when:1d'
    - 'ordinance promulgated India when:3d'
    - 'rules notified ministry India when:1d'
    - 'scheme launched ministry India when:1d'
    - 'report released India index rank when:1d'
    - '"India ranks" index when:2d'
    - 'MoU signed India when:1d'
    - 'India joint statement bilateral when:1d'
    - 'appointed chairman commission India when:1d'
    - 'Ramsar site India when:7d'
    - 'tiger reserve India when:2d'
    - '"GI tag" when:3d'

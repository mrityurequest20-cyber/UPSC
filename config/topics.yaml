# UPSC Intel: syllabus map, scoring rules, watch areas and the Google News watchlist.
#
# Keyword matching rules
#   * whole-word matching
#   * a single word containing a capital letter (RBI, ISRO, Act, Bill, Quad) matches case-sensitively,
#     so "Act" ≠ "act" and "Bill" ≠ "electricity bill"; everything else is case-insensitive
#   * lowercase terms also match their plural (tiger reserve → tiger reserves)
#   * `term: weight`: title hits count double, summary hits count once
# Edit freely, then run `python -m upsc_intel reclassify` to re-tag everything already stored.

scoring:
  tier_weight: {official: 3.0, examprep: 2.5, premium: 2.5, quality: 1.5, library: 2.0, watch: 1.25, general: 1.0, intl: 1.0}
  subject_threshold: 2        # min keyword score for a subject to stick
  max_subjects: 3
  no_subject_penalty: 1.5     # item matched no syllabus subject at all
  grades: {NOTE: 5.0, SKIM: 3.2, READ: 1.6}   # below READ → LOW (hidden by default, never deleted)

gs_papers:
  GS1: "History, Culture, Geography, Society"
  GS2: "Polity, Governance, IR, Social Justice"
  GS3: "Economy, Environment, S&T, Security, Disaster"
  GS4: "Ethics"


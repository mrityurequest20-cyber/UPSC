# UPSC Intel: public source registry
#
# Fields
#   id         unique slug
#   name       publisher shown on cards
#   section    optional sub-feed label
#   kind       rss | gnews | pib | telegram | html | browser
#   url        feed / page URL (rss, pib, html, browser, telegram)
#   query      Google News query (gnews)
#   tier       official | examprep | quality | general | intl   (drives the importance score)
#   editorial  true for opinion/editorial feeds (they get their own tab)
#   site       domain; if set, a Google News `site:` fallback is added automatically
#   fallbacks  extra steps tried in order when the step above fails
#   interval   minutes between fetches for this source (default = global interval)
#   limit      max items kept per fetch
#   allow_empty  an empty result is not treated as a failure
#
# Tested live on 2026-09-26. Sources whose direct feed is blocked or dead start on
# their Google News `site:` query, with HTML/browser steps behind it.

sources:
  # ─────────────── Official / primary record ───────────────
  - id: pib
    name: PIB
    kind: pib
    url: https://www.pib.gov.in/allRel.aspx?reg=3&lang=1
    tier: official
    site: pib.gov.in
    allow_empty: true
  - id: rbi-press
    name: RBI
    section: Press releases
    kind: rss
    url: https://www.rbi.org.in/pressreleases_rss.xml
    tier: official
    site: rbi.org.in
  - id: rbi-notifications
    name: RBI
    section: Notifications
    kind: rss
    url: https://www.rbi.org.in/notifications_rss.xml
    tier: official
  - id: sebi
    name: SEBI
    kind: rss
    url: https://www.sebi.gov.in/sebirss.xml
    tier: official
    site: sebi.gov.in
  - id: prs
    name: PRS Legislative Research
    kind: gnews
    query: "site:prsindia.org when:7d"
    tier: official
    interval: 60
    allow_empty: true
  - id: mea
    name: Ministry of External Affairs
    kind: gnews
    query: "site:mea.gov.in when:3d"
    tier: official
    interval: 60
    allow_empty: true
  - id: isro
    name: ISRO
    kind: gnews
    query: "site:isro.gov.in when:7d"
    tier: official
    interval: 120
    allow_empty: true
  - id: niti
    name: NITI Aayog
    kind: gnews
    query: "site:niti.gov.in when:7d"
    tier: official
    interval: 120
    allow_empty: true
  - id: newsonair
    name: All India Radio (NewsOnAir)
    kind: rss
    url: https://www.newsonair.gov.in/feed/
    tier: official
    site: newsonair.gov.in
  - id: ddnews
    name: DD News
    kind: rss
    url: https://ddnews.gov.in/en/feed/
    tier: general
    site: ddnews.gov.in

  # ─────────────── Exam-prep desks ───────────────
  - id: ie-upsc
    name: Indian Express
    section: UPSC Current Affairs
    kind: rss
    url: https://indianexpress.com/section/upsc-current-affairs/feed/
    tier: examprep
  - id: insights
    name: Insights on India
    kind: rss
    url: https://www.insightsonindia.com/feed/
    tier: examprep
    site: insightsonindia.com
  - id: forumias
    name: ForumIAS
    kind: rss
    url: https://forumias.com/blog/feed/
    tier: examprep
    site: forumias.com
  - id: iasbaba
    name: IASbaba
    kind: rss
    url: https://iasbaba.com/feed/
    tier: examprep
    site: iasbaba.com
  - id: vajiram
    name: Vajiram & Ravi
    kind: rss
    url: https://vajiramandravi.com/current-affairs/feed/
    tier: examprep
    site: vajiramandravi.com
  - id: drishti
    name: Drishti IAS
    kind: gnews
    query: "site:drishtiias.com when:2d"
    tier: examprep
    interval: 30
    fallbacks:
      - kind: html
        url: https://www.drishtiias.com/current-affairs-news-analysis-editorials
        link_pattern: "/daily-updates/"
      - kind: browser
        url: https://www.drishtiias.com/current-affairs-news-analysis-editorials
        link_pattern: "/daily-updates/"
  - id: nextias
    name: NEXT IAS
    kind: gnews
    query: "site:nextias.com when:3d"
    tier: examprep
    interval: 60
    allow_empty: true
    fallbacks:
      - kind: html
        url: https://www.nextias.com/ca/headlines-of-the-day
        link_pattern: "/ca/"
      - kind: browser
        url: https://www.nextias.com/ca/headlines-of-the-day
        link_pattern: "/ca/"
  - id: civilsdaily
    name: Civilsdaily
    kind: rss
    url: https://www.civilsdaily.com/feed/
    tier: examprep
    site: civilsdaily.com
  - id: gktoday
    name: GKToday
    kind: gnews
    query: "site:gktoday.in when:2d"
    tier: general
    interval: 60
    allow_empty: true


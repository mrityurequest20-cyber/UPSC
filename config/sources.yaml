# UPSC Intel: public source registry
#
# Fields
#   id         unique slug
#   name       publisher shown on cards
#   section    optional sub-feed label
#   kind       rss | gnews | pib | telegram | html | browser
#   url        feed / page URL (rss, pib, html, browser, telegram)
#   query      Google News query (gnews)
#   tier       official | examprep | quality | general | intl   (drives the importance score)
#   editorial  true for opinion/editorial feeds (Editorials section + tab)
#   explained  true for explainer feeds (Explained section + tab). Without either flag, items
#              are still recognised from their headline or URL ("… | Explained", /opinion/…)
#   describe   true when the feed ships headlines only: new items get the article's public
#              preview text (og:description) as their summary
#   site       domain; if set, a Google News `site:` fallback is added automatically
#   fallbacks  extra steps tried in order when the step above fails
#   interval   minutes between fetches for this source (default = global interval)
#   limit      max items kept per fetch
#   allow_empty  an empty result is not treated as a failure
#
# Tested live on 2026-09-26. Sources whose direct feed is blocked or dead start on
# their Google News `site:` query, with HTML/browser steps behind it.

sources:
  # ─────────────── Official / primary record ───────────────
  - id: pib
    name: PIB
    kind: pib
    url: https://www.pib.gov.in/allRel.aspx?reg=3&lang=1
    tier: official
    site: pib.gov.in
    allow_empty: true
  - id: rbi-press
    name: RBI
    section: Press releases
    kind: rss
    url: https://www.rbi.org.in/pressreleases_rss.xml
    tier: official
    site: rbi.org.in
  - id: rbi-notifications
    name: RBI
    section: Notifications
    kind: rss
    url: https://www.rbi.org.in/notifications_rss.xml
    tier: official
  - id: sebi
    name: SEBI
    kind: rss
    url: https://www.sebi.gov.in/sebirss.xml
    tier: official
    site: sebi.gov.in
  - id: prs
    name: PRS Legislative Research
    kind: gnews
    query: "site:prsindia.org when:7d"
    tier: official
    interval: 60
    allow_empty: true
  - id: mea
    name: Ministry of External Affairs
    kind: gnews
    query: "site:mea.gov.in when:3d"
    tier: official
    interval: 60
    allow_empty: true
  - id: isro
    name: ISRO
    kind: gnews
    query: "site:isro.gov.in when:7d"
    tier: official
    interval: 120
    allow_empty: true
  - id: niti
    name: NITI Aayog
    kind: gnews
    query: "site:niti.gov.in when:7d"
    tier: official
    interval: 120
    allow_empty: true
  - id: newsonair
    name: All India Radio (NewsOnAir)
    kind: rss
    url: https://www.newsonair.gov.in/feed/
    tier: official
    site: newsonair.gov.in
  - id: ddnews
    name: DD News
    kind: rss
    url: https://ddnews.gov.in/en/feed/
    tier: general
    site: ddnews.gov.in


        url: https://www.nextias.com/ca/headlines-of-the-day
        link_pattern: "/ca/"
      - kind: browser
        url: https://www.nextias.com/ca/headlines-of-the-day
        link_pattern: "/ca/"
  - id: civilsdaily
    name: Civilsdaily
    kind: rss
    url: https://www.civilsdaily.com/feed/
    tier: examprep
    site: civilsdaily.com
  - id: gktoday
    name: GKToday
    kind: gnews

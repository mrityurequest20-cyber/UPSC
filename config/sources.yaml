  - {id: hindu-education, name: The Hindu, section: Education, kind: rss, url: "https://www.thehindu.com/education/feeder/default.rss", tier: quality}
  - {id: hindu-editorial, name: The Hindu, section: Editorial, kind: rss, url: "https://www.thehindu.com/opinion/editorial/feeder/default.rss", tier: quality, editorial: true}
  - {id: hindu-lead, name: The Hindu, section: Lead, kind: rss, url: "https://www.thehindu.com/opinion/lead/feeder/default.rss", tier: quality, editorial: true}

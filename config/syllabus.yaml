# The UPSC Civil Services syllabus as a map (pipeline/syllabus.py): the Mains GS papers' official lines, each split into
# micro-topics the news can be filed under. The Prelims GS paper's areas (history, geography, polity, economy,
# environment, science) are the same topics, flagged `prelims: true`.
#
# Every brief card is tagged with 1-2 micro-topics: Intel AI picks them from this list as it reads the day's cards, and
# the keyword rules below tag the rest (and every card when the AI is off). The rules work like config/topics.yaml's:
#   * whole-word matching; a single word with a capital (ISRO, RBI, Quad) matches case-sensitively; lowercase terms also
#     match their plural
#   * `term: weight`: a headline hit counts double. A topic needs 2 points (plus 1 when the story's subject in
#     topics.yaml is one of the topic's `subj`), and a term of weight 1.5 or more, or two different terms
#   * keep the terms specific: a term that fits several topics belongs to none
# ncert: the NCERT books (and chapters where it helps) that cover the line's basics, free at ncert.nic.in/textbook.php.
#
# `line` is the syllabus's own wording (lightly trimmed). Edit freely; the ids are what progress on a device is kept
# against, so rename an id only with care.


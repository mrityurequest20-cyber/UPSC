# Running stories a UPSC aspirant follows (pipeline/dossiers.py): each becomes a dossier while it is in the news.
# A topic's timeline is every story worth reading whose headline carries ALL its query words (a full-text search of
# everything stored), so a topic shows only when it has reports on two days in the last month. Intel AI adds more
# topics as it reads the brief's cards, reusing these names when one fits; the story so far is written by Intel AI.
#   name · query (1-3 words every headline on it has; prefixes count: "Naxal" finds "Naxalism") · gs

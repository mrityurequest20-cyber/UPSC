<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuantDesk">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>QuantDesk</title>
<style>
:root{color-scheme:light;--page:#f9f9f7;--surface:#fcfcfb;--surface2:#f3f2ee;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
--grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.10);--up:#2a78d6;--down:#e34948;--s1:#2a78d6;--s2:#eb6834;
--good:#006300;--bad:#d03b3b;--warn:#8a5a00;--track:#cde2fb;--wash:rgba(11,11,11,.05);--mid:#f0efec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--surface2:#232321;
--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--up:#3987e5;--down:#e66767;
--s1:#3987e5;--s2:#d95926;--good:#0ca30c;--bad:#e66767;--warn:#fab219;--track:#184f95;--wash:rgba(255,255,255,.06);--mid:#383835}}
:root[data-theme="dark"]{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--surface2:#232321;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
--grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.10);--up:#3987e5;--down:#e66767;--s1:#3987e5;--s2:#d95926;--good:#0ca30c;
--bad:#e66767;--warn:#fab219;--track:#184f95;--wash:rgba(255,255,255,.06);--mid:#383835}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
background:var(--surface);border-bottom:1px solid var(--ring)}
header h1{font-size:17px;margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap}
header select{max-width:44vw;min-width:0;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good)}.dot.paused{background:var(--warn)}.dot.stale{background:var(--bad)}
select,button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:8px 12px;min-height:40px}
button{cursor:pointer}button:active{background:var(--wash)}button.primary{background:var(--s1);border-color:var(--s1);color:#fff}
button.danger{border-color:var(--bad);color:var(--bad)}button.small{min-height:34px;padding:5px 10px;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 16px calc(88px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--ring);
padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;border-radius:0;background:transparent;min-height:58px;font-size:12px;color:var(--ink2);display:flex;
flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
@media (min-width:900px){nav.tabs{position:sticky;top:61px;bottom:auto;max-width:1100px;margin:0 auto;border:0;background:transparent;
padding:8px 16px 0;gap:6px}nav.tabs button{flex:0 0 auto;flex-direction:row;min-height:38px;border-radius:10px;padding:6px 14px;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--surface);border:1px solid var(--ring)}main{padding-bottom:40px}}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}.hero .v{font-size:30px;font-weight:650}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.kv div{background:var(--surface2);border-radius:10px;padding:8px 10px}.kv span{display:block;color:var(--ink2);font-size:12px}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;padding:5px 12px;font-size:13px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--wash);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ring);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.chip.bullish i{background:var(--up)}.chip.bearish i{background:var(--down)}
.meter{height:8px;background:var(--track);border-radius:4px;overflow:hidden;flex:1;min-width:80px}.meter i{display:block;height:100%;background:var(--s1);border-radius:4px}
.narr{color:var(--ink2);font-size:14px;margin:10px 0 0}
.ev{display:grid;grid-template-columns:92px 72px 1fr;gap:4px 10px;align-items:center;font-size:13px;margin-top:8px}
.ev .f{color:var(--ink2)}.ev .o{color:var(--ink)}
@media (max-width:560px){.ev{grid-template-columns:96px 1fr}.ev .o{grid-column:1/-1;margin:-2px 0 6px;color:var(--ink2)}}
.list .item .narr.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.list .item.open .narr.clamp{display:block}
.dbar{position:relative;height:10px;background:var(--surface2);border-radius:5px}
.dbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--axis)}
.dbar i{position:absolute;top:0;bottom:0;border-radius:5px}
.chart{position:relative;width:100%;height:300px;touch-action:pan-y}@media (min-width:900px){.chart{height:400px}}
.chart svg{width:100%;height:100%;display:block}.chart svg text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart svg text.lvl{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--ink2);font-size:12px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.list .item{border-top:1px solid var(--grid);padding:10px 0;cursor:pointer}.list .item:first-child{border-top:0}
.item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item .top .t{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.item .act{font-size:13px;margin-top:4px}.item .act.trade{font-weight:600}
.grade{display:inline-block;min-width:24px;text-align:center;border:1px solid var(--ring);border-radius:6px;font-weight:650;font-size:13px}
.leg{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;font-size:12px;font-variant-numeric:tabular-nums;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
td,th{white-space:nowrap}td:first-child,th:first-child{text-align:left}th{color:var(--ink2);font-weight:600}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:10px 12px}.tile span{color:var(--ink2);font-size:12px;display:block}
.tile b{font-size:20px;font-weight:650}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}.sheet .body{background:var(--surface);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
padding:16px 16px calc(24px + env(safe-area-inset-bottom))}@media (min-width:760px){.sheet{align-items:center}.sheet .body{border-radius:16px}}
.md h1{font-size:19px}.md h2{font-size:16px;margin:18px 0 6px}.md p,.md li{color:var(--ink2);font-size:14px}.md table{margin:8px 0}
.tt{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:8px 10px;font-size:12px;
box-shadow:0 6px 20px rgba(0,0,0,.18);display:none;z-index:9;max-width:280px}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface);
border:1px solid var(--ring);border-radius:10px;padding:10px 14px;display:none;z-index:11;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.banner{border-left:4px solid var(--warn);background:var(--surface);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ink2)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot" aria-hidden="true"></span>QuantDesk</h1>
  <select id="account" aria-label="Account"></select>
  <button id="theme" class="small" aria-label="Toggle dark mode">◐</button>
</header>
<nav class="tabs" role="tablist" id="tabs"></nav>
<main>
  <section data-view="live">
    <div id="banner" class="banner" hidden></div>
    <div class="card">
      <div class="hero"><div><span class="muted small">Equity</span><div class="v" id="eq">—</div></div>
        <div><span class="muted small">Today</span><div id="daypnl" style="font-size:20px;font-weight:600">—</div></div>
        <div class="grow"></div><span class="chip" id="status">—</span></div>
      <div class="kv"><div><span>Trades today</span><b id="k-trades">—</b></div><div><span>Open</span><b id="k-open">—</b></div>
        <div><span>All-time P&amp;L</span><b id="k-total">—</b></div><div><span>Updated</span><b id="k-age">—</b></div></div>
      <div class="row" style="margin-top:12px"><button id="btn-pause">Pause new entries</button><button id="btn-flatten" class="danger">Flatten all</button></div>
    </div>
    <div class="row" style="margin-bottom:10px"><div class="seg" id="symseg" role="group" aria-label="Underlying"></div><div class="grow"></div>
      <div class="seg" id="ivseg" role="group" aria-label="Interval"></div></div>
    <div class="card" id="viewcard"></div>
    <div class="card"><h2>Chart<span class="sp"></span><span class="small muted" id="chartday"></span>
      <button class="small" id="btn-pro" title="Load the GoCharting SDK (needs network + license)">Pro chart</button></h2><div class="chart" id="chart"></div>
      <div class="legend" id="chartlegend"></div></div>
    <div class="card"><h2>Open positions</h2><div id="positions"></div></div>
    <div class="card"><h2>Closed today</h2><div id="closedtoday" class="list"></div></div>
  </section>
  <section data-view="thinking" hidden>
    <div class="row" style="margin-bottom:10px"><div class="seg" id="thseg"></div></div>
    <div class="card"><div class="list" id="thoughts"></div><button id="more" style="width:100%;margin-top:8px">Load earlier</button></div>
  </section>
  <section data-view="trades" hidden><div class="card"><div class="list" id="tradelist"></div></div></section>
  <section data-view="stats" hidden><div id="stats"></div></section>
  <section data-view="reviews" hidden><div class="card"><div class="list" id="reviewlist"></div></div></section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="body" id="sheetbody"></div></div>
<div class="tt" id="tt"></div><div id="toast" role="status"></div>
<script src="/static/datafeed.js"></script>
<script src="/static/app/app.js"></script>
</body>
</html>

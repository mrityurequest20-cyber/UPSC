# Every 20 minutes: fetch the public sources that are due, rebuild the static dashboard, publish to GitHub Pages.
#
# One-time setup (repo Settings):
#   1. Merge this to the default branch (scheduled workflows only run there).
#   2. Settings → Pages → Build and deployment → Source: "GitHub Actions".
#      (Pages on a PRIVATE repo needs a paid GitHub plan; on a free plan make the repo public first.)
#   3. (Optional) Settings → Secrets → Actions → ANTHROPIC_API_KEY to add AI notes.
# The site is PUBLIC: only public sources are exported. Email / PDFs / private feeds stay local.
name: Live dashboard (GitHub Pages)

on:
  schedule:
    - cron: "7,27,47 * * * *"  # GitHub may start scheduled runs a few minutes late at busy times
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["upsc_intel/**", "config/**", ".github/workflows/*.yml", "requirements.txt"]

permissions:
  contents: write  # to save finished months to the `archive` branch
  pages: write
  id-token: write
  actions: write  # to delete old database caches

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      UPSC_SITE_REFRESH_MIN: "20"  # keep in step with the cron above (shown on the page)
      UPSC_KEEP_DAYS: "45"         # the working database; finished months live on in the archive branch
    steps:
      # First, so a repo without Pages enabled fails in seconds instead of after a full fetch.
      - uses: actions/configure-pages@v5

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/upsc.db
          key: upsc-db-${{ github.run_id }}
          restore-keys: upsc-db-

      # Each source has its own interval (15 min for most, 60 for Google News queries); the database
      # carries the last-fetch times between runs, so only sources that are due are fetched.
      - name: Fetch public sources
        env:
          UPSC_BROWSER_FALLBACK: "0"
        run: python -m upsc_intel fetch --public-only

      - name: AI notes (only if the secret is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m upsc_intel enrich

      # Finished months, frozen as the site showed them: kept forever on the `archive` branch.
      - name: Get the archive of past months
        run: |
          auth="$(git config --get http.https://github.com/.extraheader || true)"  # the checkout's token, for a private repo too
          if git ls-remote --exit-code --heads origin archive > /dev/null; then
            git -c http.https://github.com/.extraheader="$auth" clone --quiet --depth 1 --branch archive "$(git remote get-url origin)" archive
          else
            git init --quiet -b archive archive
            git -C archive remote add origin "$(git remote get-url origin)"
          fi
          git -C archive config http.https://github.com/.extraheader "$auth"

      # Claude-written study notes: a scheduled Claude Code routine (on the owner's Claude plan, no API
      # key) pushes notes/YYYY-MM-DD.json to the claude/ai-notes branch; they become the stories' write-ups.
      - name: Import Claude notes
        run: |
          auth="$(git config --get http.https://github.com/.extraheader || true)"
          if git ls-remote --exit-code --heads origin claude/ai-notes > /dev/null; then
            git -c http.https://github.com/.extraheader="$auth" clone --quiet --depth 1 --branch claude/ai-notes "$(git remote get-url origin)" ai-notes
            python -m upsc_intel import-notes ai-notes/notes
          else
            echo "no Claude notes yet"
          fi

      # before saving: the export builds briefs for days that don't have one yet, and they must persist
      - name: Build static site
        run: python -m upsc_intel export-static --out site --days 62 --archive archive/data

      - name: Save newly finished months to the archive
        run: |
          cd archive
          if [ ! -d data ] || [ -z "$(ls -A data)" ]; then echo "no finished month yet"; exit 0; fi
          git add -A data
          if git diff --cached --quiet; then echo "archive unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Archive: $(git diff --cached --name-only | sed 's|data/||' | tr '\n' ' ')"
          git push --quiet origin archive
          git log --oneline -1

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/upsc.db
          key: upsc-db-${{ github.run_id }}

      - name: Delete older database caches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key upsc-db- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's schedule above is best-effort (on this repository it took hours to start, and it can skip
  # runs), so the "Update timer" watchdog (keepalive.yml) starts an update whenever one is overdue.
  # Every build checks that the watchdog is running and restarts it if not.
  timer:
    needs: deploy
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Make sure the update timer is running
        run: |
          active=$(gh run list --workflow keepalive.yml --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" -gt 0 ]; then echo "Update timer is running."; exit 0; fi
          echo "Update timer is not running: starting it."
          gh workflow run keepalive.yml --ref main
